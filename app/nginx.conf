server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # MIME-Typen: Standardliste von nginx (enthält application/wasm für .wasm und application/javascript für .js).
  # Hinweis: Ein eigener types{}-Block hier würde die Standardliste komplett ERSETZEN.

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_vary on;
  gzip_types text/css text/javascript application/javascript application/json application/wasm image/svg+xml text/plain;

  # Datenschutz/Sicherheit: keine externen Quellen, kein Referrer, keine Einbettung fremder Inhalte
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

  # index.html nie lange cachen, damit Updates sofort ankommen
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
  # JS/CSS: kurz cachen + Revalidierung (Dateinamen haben keinen Hash)
  location ~* \.(?:js|mjs|css)$ {
    add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
  # Schriften, Bilder, Graphviz: lange cachen
  location ~* \.(?:woff2|svg|png|ico|wasm)$ {
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
  location /vendor/ {
    add_header Cache-Control "public, max-age=2592000" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
