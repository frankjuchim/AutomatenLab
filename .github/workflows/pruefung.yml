# Prüfung bei jedem Push und Pull Request.
# Hinweis: Die Live-App baut CapRover direkt bei jedem Push auf main (Webhook) – diese Prüfung blockiert das nicht.
# Deshalb auf Feature-Branches arbeiten und erst nach grüner Prüfung nach main übernehmen.
name: Prüfung

on:
  push:
  pull_request:

jobs:
  tests:
    name: App-Tests (Engine, Inhalte)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test

  deep-links:
    name: Deep-Links im Container (QR-Routen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Image wie auf CapRover bauen und starten
        run: |
          docker build -t automatenlab .
          docker run -d --rm -p 8080:80 --name automatenlab automatenlab
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/ >/dev/null && break; sleep 1; done
      - run: node qa/qa-routes.mjs http://localhost:8080/
