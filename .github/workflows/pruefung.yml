# Prüfung bei jedem Push und Pull Request.
# Hinweis: Die Live-App baut CapRover direkt bei jedem Push auf main (Webhook) – diese Prüfung blockiert das nicht.
# Deshalb auf Feature-Branches arbeiten und erst nach grüner Prüfung nach main übernehmen.
name: Prüfung

on:
  push:
  pull_request:

jobs:
  tests:
    name: App- und Server-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm test

  container:
    name: Container, Vertrag und Deep-Links (QR-Routen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Testschlüssel für die Portal-Anmeldung erzeugen (nur für diese Prüfung)
        run: |
          node -e "const c=require('crypto');const p=c.generateKeyPairSync('ed25519');const fs=require('fs');fs.writeFileSync('/tmp/qa-priv.pem',p.privateKey.export({type:'pkcs8',format:'pem'}));fs.writeFileSync('/tmp/qa-pub.pem',p.publicKey.export({type:'spki',format:'pem'}))"
      - name: Image wie auf CapRover bauen und mit Test-Portal starten
        run: |
          docker build -t automatenlab .
          docker run -d --rm -p 8080:80 --name automatenlab \
            -e PLATTFORM_URL=http://localhost:8080 -e PORTAL_URL=http://portal.test -e AUTH_MODUS=portal \
            -e SESSION_SECRET=ci-geheimnis-nur-fuer-die-pruefung -e PORTAL_PUBLIC_KEY="$(cat /tmp/qa-pub.pem)" automatenlab
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/healthz >/dev/null && break; sleep 1; done
          curl -fsS http://localhost:8080/healthz | grep -q '"anmeldung":"portal"'
      - name: Vertragsprüfung (scripts/vertrag_pruefen.js)
        run: node scripts/vertrag_pruefen.js http://localhost:8080
      - name: Alle Deep-Links angemeldet (Lehrkraft mit Kurs, Test-Token)
        run: QA_PORTAL_KEY=/tmp/qa-priv.pem node qa/qa-routes.mjs http://localhost:8080/
      - name: Alle Deep-Links als Gast (nur Demo-Routen offen, sonst Anmeldung mit ziel = Route)
        run: QA_GAST=1 node qa/qa-routes.mjs http://localhost:8080/
